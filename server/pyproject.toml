[project]
name = "koko-server"
version = "1.0.0"
description = "Asynchronous Python backend for Koko AI - 3D VRM Anime Assistant"
requires-python = ">=3.11, <3.15"
dependencies = [
    "websockets>=13.0",
    "faster-whisper>=1.0.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    "openai>=1.50.0",
    "mistralai>=1.0.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "scipy>=1.11.0",
    "python-dateutil>=2.8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

